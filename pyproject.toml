[project]
name = "apple-ads-insights-mcp"
version = "0.2.6"
description = "Read-only, analysis-first MCP server for the Apple Ads Platform API (App Store campaigns). Unofficial community project; not affiliated with, endorsed, or supported by Apple Inc."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
apple-ads-mcp = "apple_ads_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_ads_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
